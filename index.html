<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>LumenIQ Portal</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ChartJS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Inter, sans-serif;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">

  <div id="app"></div>

  <!-- BASES -->
  <script src="./municipios_base.js"></script>
  <script src="./dados_municipios.js"></script>

  <script>

    // =========================================================
    // DEBUG GLOBAL
    // =========================================================

    window.onerror = function (msg, src, line, col, err) {

      console.error(err);

      document.body.innerHTML = `
        <div style="padding:40px;font-family:sans-serif">
          <h1 style="color:red;font-size:28px;margin-bottom:20px;">
            Erro JavaScript
          </h1>

          <p><strong>Mensagem:</strong> ${msg}</p>
          <p><strong>Linha:</strong> ${line}</p>
          <p><strong>Arquivo:</strong> ${src}</p>

          <pre style="margin-top:20px;background:#f1f5f9;padding:20px;border-radius:8px;">
${err?.stack || ''}
          </pre>
        </div>
      `;
    };

    // =========================================================
    // DADOS
    // =========================================================

    const BASE_MUNICIPIOS =
      window.MUNICIPIOS_BASE_COMPLETO ||
      [
        [3550308, 'São Paulo', 'SP', 'Sudeste', 11451999, 65000],
        [3304557, 'Rio de Janeiro', 'RJ', 'Sudeste', 6211423, 52000],
        [5300108, 'Brasília', 'DF', 'Centro-Oeste', 2817068, 89000],
      ];

    const DADOS_REAIS =
      window.DADOS_MUNICIPIOS_REAIS || {};

    // =========================================================
    // HELPERS
    // =========================================================

    function fmtNum(v) {
      return Number(v).toLocaleString('pt-BR');
    }

    function fmtBRL(v) {

      if (v >= 1e9)
        return 'R$ ' + (v / 1e9).toFixed(1).replace('.', ',') + ' bi';

      if (v >= 1e6)
        return 'R$ ' + (v / 1e6).toFixed(1).replace('.', ',') + ' mi';

      return 'R$ ' + fmtNum(v);
    }

    function scoreBarColor(score) {

      if (score >= 75)
        return 'bg-emerald-500';

      if (score >= 55)
        return 'bg-blue-500';

      if (score >= 35)
        return 'bg-amber-500';

      return 'bg-rose-500';
    }

    function capagColor(capag) {

      return {
        A: 'bg-emerald-100 text-emerald-700',
        B: 'bg-blue-100 text-blue-700',
        C: 'bg-amber-100 text-amber-700',
        D: 'bg-rose-100 text-rose-700'
      }[capag];
    }

    // =========================================================
    // MOCK
    // =========================================================

    function random(min, max) {
      return Math.round(Math.random() * (max - min) + min);
    }

    const MUNICIPIOS = BASE_MUNICIPIOS.map((m, i) => {

      const [ibge, nome, uf, regiao, populacao, pib] = m;

      const real = DADOS_REAIS[String(ibge)] || {};

      const cosip =
        real.cosip_anual ||
        random(5_000_000, 500_000_000);

      const score = random(30, 95);

      const capags = ['A', 'B', 'C', 'D'];

      return {

        id: i + 1,
        ibge,
        nome,
        uf,
        regiao,
        populacao,
        pib,

        cosip_anual: cosip,

        total_pontos: random(1000, 100000),

        pct_led: random(10, 95),

        capag: capags[random(0, 3)],

        scores: {
          geral: score,
          financeira: random(30, 95),
          modernizacao: random(30, 95),
          smartcity: random(30, 95),
        }
      };
    });

    // =========================================================
    // ESTADO
    // =========================================================

    const state = {

      route: 'dashboard',
      routeParam: null
    };

    // =========================================================
    // NAVEGAÇÃO
    // =========================================================

    function navigate(route, param = null) {

      state.route = route;
      state.routeParam = param;

      render();
    }

    window.navigate = navigate;

    // =========================================================
    // COMPONENTES
    // =========================================================

    function scoreRow(label, score) {

      return `
        <div>
          <div class="flex justify-between text-sm mb-1">
            <span>${label}</span>
            <span class="font-bold">${score}</span>
          </div>

          <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
            <div
              class="${scoreBarColor(score)} h-full"
              style="width:${score}%">
            </div>
          </div>
        </div>
      `;
    }

    function municipioCard(m) {

      return `
        <div
          onclick="navigate('perfil', ${m.id})"
          class="bg-white rounded-xl border border-slate-200 p-5 cursor-pointer hover:shadow-lg transition">

          <div class="flex items-center justify-between">

            <div>

              <div class="flex items-center gap-2 flex-wrap">

                <h3 class="font-bold text-lg">
                  ${m.nome}
                </h3>

                <span class="text-sm text-slate-500">
                  ${m.uf}
                </span>

                <span class="badge ${capagColor(m.capag)}">
                  CAPAG ${m.capag}
                </span>

              </div>

              <div class="text-sm text-slate-500 mt-1">
                ${fmtNum(m.populacao)} habitantes
              </div>

            </div>

            <div class="text-right">

              <div class="text-3xl font-bold text-indigo-600">
                ${m.scores.geral}
              </div>

              <div class="text-xs text-slate-500">
                score
              </div>

            </div>

          </div>

          <div class="grid grid-cols-3 gap-3 mt-5 text-sm">

            <div>
              <div class="text-slate-500">
                COSIP
              </div>

              <div class="font-semibold">
                ${fmtBRL(m.cosip_anual)}
              </div>
            </div>

            <div>
              <div class="text-slate-500">
                Pontos IP
              </div>

              <div class="font-semibold">
                ${fmtNum(m.total_pontos)}
              </div>
            </div>

            <div>
              <div class="text-slate-500">
                LED
              </div>

              <div class="font-semibold">
                ${m.pct_led}%
              </div>
            </div>

          </div>

        </div>
      `;
    }

    // =========================================================
    // DASHBOARD
    // =========================================================

    function renderDashboard() {

      const totalMercado =
        MUNICIPIOS.reduce((a, b) => a + b.cosip_anual, 0);

      return `

        <div class="max-w-7xl mx-auto p-6 space-y-6">

          <div>

            <h1 class="text-4xl font-bold">
              LumenIQ Portal
            </h1>

            <p class="text-slate-500 mt-2">
              Inteligência de Mercado COSIP & Smart Cities
            </p>

          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

            <div class="bg-white rounded-xl border border-slate-200 p-5">

              <div class="text-sm text-slate-500">
                Mercado COSIP
              </div>

              <div class="text-3xl font-bold mt-2">
                ${fmtBRL(totalMercado)}
              </div>

            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-5">

              <div class="text-sm text-slate-500">
                Municípios
              </div>

              <div class="text-3xl font-bold mt-2">
                ${fmtNum(MUNICIPIOS.length)}
              </div>

            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-5">

              <div class="text-sm text-slate-500">
                Pontos IP
              </div>

              <div class="text-3xl font-bold mt-2">
                ${fmtNum(
        MUNICIPIOS.reduce((a, b) => a + b.total_pontos, 0)
      )}
              </div>

            </div>

          </div>

          <div class="space-y-3">

            ${MUNICIPIOS.map(municipioCard).join('')}

          </div>

        </div>
      `;
    }

    // =========================================================
    // PERFIL
    // =========================================================

    function renderPerfil() {

      const m =
        MUNICIPIOS.find(x => x.id === state.routeParam);

      if (!m)
        return `
          <div class="p-10">
            Município não encontrado
          </div>
        `;

      return `

        <div class="max-w-7xl mx-auto p-6 space-y-6">

          <button
            onclick="navigate('dashboard')"
            class="text-indigo-600 hover:underline">

            ← Voltar

          </button>

          <div class="bg-white rounded-xl border border-slate-200 p-6">

            <div class="flex items-center justify-between flex-wrap gap-4">

              <div>

                <div class="flex items-center gap-3 flex-wrap">

                  <h1 class="text-4xl font-bold">
                    ${m.nome}
                  </h1>

                  <span class="text-slate-500">
                    ${m.uf}
                  </span>

                  <span class="badge ${capagColor(m.capag)}">
                    CAPAG ${m.capag}
                  </span>

                </div>

                <div class="text-slate-500 mt-2">
                  ${fmtNum(m.populacao)} habitantes
                </div>

              </div>

              <div class="text-right">

                <div class="text-5xl font-bold text-indigo-600">
                  ${m.scores.geral}
                </div>

                <div class="text-sm text-slate-500">
                  Score Geral
                </div>

              </div>

            </div>

          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <div class="bg-white rounded-xl border border-slate-200 p-6">

              <h2 class="font-bold text-xl mb-5">
                Indicadores
              </h2>

              <div class="space-y-4">

                ${scoreRow('Financeira', m.scores.financeira)}

                ${scoreRow('Modernização', m.scores.modernizacao)}

                ${scoreRow('Smart City', m.scores.smartcity)}

              </div>

            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-6">

              <h2 class="font-bold text-xl mb-5">
                Dados Gerais
              </h2>

              <div class="space-y-3 text-sm">

                <div class="flex justify-between">
                  <span>PIB per capita</span>
                  <strong>R$ ${fmtNum(m.pib)}</strong>
                </div>

                <div class="flex justify-between">
                  <span>COSIP</span>
                  <strong>${fmtBRL(m.cosip_anual)}</strong>
                </div>

                <div class="flex justify-between">
                  <span>Pontos IP</span>
                  <strong>${fmtNum(m.total_pontos)}</strong>
                </div>

                <div class="flex justify-between">
                  <span>% LED</span>
                  <strong>${m.pct_led}%</strong>
                </div>

              </div>

            </div>

          </div>

          <div class="bg-white rounded-xl border border-slate-200 p-6">

            <h2 class="font-bold text-xl mb-5">
              Score Radar
            </h2>

            <div class="h-96">
              <canvas id="chartRadar"></canvas>
            </div>

          </div>

        </div>
      `;
    }

    // =========================================================
    // RENDER
    // =========================================================

    function render() {

      const app =
        document.getElementById('app');

      let html = '';

      switch (state.route) {

        case 'perfil':
          html = renderPerfil();
          break;

        default:
          html = renderDashboard();
      }

      app.innerHTML = html;

      initCharts();
    }

    // =========================================================
    // CHARTS
    // =========================================================

    function initCharts() {

      if (state.route !== 'perfil')
        return;

      const m =
        MUNICIPIOS.find(x => x.id === state.routeParam);

      if (!m)
        return;

      const ctx =
        document.getElementById('chartRadar');

      if (!ctx)
        return;

      new Chart(ctx, {

        type: 'radar',

        data: {

          labels: [
            'Financeira',
            'Modernização',
            'Smart City'
          ],

          datasets: [{

            label: m.nome,

            data: [
              m.scores.financeira,
              m.scores.modernizacao,
              m.scores.smartcity
            ],

            backgroundColor: 'rgba(99,102,241,0.2)',

            borderColor: '#6366f1',

            pointBackgroundColor: '#6366f1',

            borderWidth: 2
          }]
        },

        options: {

          responsive: true,

          maintainAspectRatio: false,

          scales: {

            r: {

              min: 0,
              max: 100
            }
          }
        }
      });
    }

    // =========================================================
    // START
    // =========================================================

    document.addEventListener('DOMContentLoaded', () => {

      console.log('LumenIQ iniciado');

      console.log(
        'BASE:',
        window.MUNICIPIOS_BASE_COMPLETO
      );

      console.log(
        'DADOS:',
        window.DADOS_MUNICIPIOS_REAIS
      );

      render();
    });

  </script>

</body>

</html>
